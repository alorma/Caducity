<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  blob(n, a, rot) {
    rot = rot || 0;
    var p = [];
    for (var i = 0; i < 120; i++) {
      var t = i / 120 * Math.PI * 2;
      var r = 50 - a + a * Math.cos(n * (t + rot));
      p.push((50 + r * Math.cos(t)).toFixed(1) + " " + (50 + r * Math.sin(t)).toFixed(1));
    }
    return "M" + p.join("L") + "Z";
  }
  renderVals() {
    return { cookie: this.blob(9, 3, 0), sunny: this.blob(8, 4, 0) };
  }
}
</script>
