<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';font-variation-settings:'FILL' 1,'wght' 500,'opsz' 48;display:inline-block}

<div style="width: 1024px; height: 500px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBF6EC; color: #29241C; font-family: 'Figtree', sans-serif">
  <svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; left: 480px; top: -60px; width: 620px; height: 620px"><path d="{{cookie}}" fill="#E8B95A"></path></svg>
  <svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; left: -80px; top: 372px; width: 220px; height: 220px"><path d="{{cookie}}" fill="#DCE3B0"></path></svg>

  <div style="position: absolute; left: 64px; top: 0; bottom: 0; width: 430px; display: flex; flex-direction: column; justify-content: center; gap: 20px">
    <div aria-hidden="true" style="position: relative; width: 88px; height: 88px; border-radius: 26px; background: #E8B95A; display: flex; align-items: center; justify-content: center; overflow: hidden">
      <svg viewBox="0 0 100 100" style="position: absolute; width: 59px; height: 59px"><path d="{{cookie}}" fill="#4D5A1E"></path></svg>
      <span class="ms" style="position: relative; font-size: 31px; color: #FBF6EC">eco</span>
    </div>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 96px; line-height: 0.92; font-weight: 800; font-stretch: 80%; letter-spacing: -1.5px">Caducity</h1>
    <p style="margin: 0; max-width: 400px; font-size: 26px; line-height: 1.25; font-weight: 600; color: #665C4C">Que no se te caduque nada en la nevera.</p>
  </div>

  <div style="position: absolute; left: 548px; top: 44px; width: 211px; height: 456px; box-sizing: content-box; border: 5px solid #29241C; border-radius: 30px; overflow: hidden; box-shadow: 0 10px 28px rgba(41,36,28,0.28)">
    <div style="width: 390px; height: 844px; transform: scale(0.54); transform-origin: 0 0"><dc-import name="CdInici" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="position: absolute; left: 786px; top: 92px; width: 211px; height: 456px; box-sizing: content-box; border: 5px solid #29241C; border-radius: 30px; overflow: hidden; box-shadow: 0 10px 28px rgba(41,36,28,0.28)">
    <div style="width: 390px; height: 844px; transform: scale(0.54); transform-origin: 0 0"><dc-import name="CdRebost" hint-size="390px,844px"></dc-import></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":500}}'>
class Component extends DCLogic {
  blob(n, a, rot) {
    rot = rot || 0;
    var p = [];
    for (var i = 0; i < 120; i++) {
      var t = i / 120 * Math.PI * 2;
      var r = 50 - a + a * Math.cos(n * (t + rot));
      p.push((50 + r * Math.cos(t)).toFixed(1) + " " + (50 + r * Math.sin(t)).toFixed(1));
    }
    return "M" + p.join("L") + "Z";
  }
  renderVals() {
    return { cookie: this.blob(9, 3, 0) };
  }
}
</script>
