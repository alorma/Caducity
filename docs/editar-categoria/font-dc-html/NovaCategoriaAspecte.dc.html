<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFAEE; font-family: 'Figtree', sans-serif; color: #2B2418"><div aria-hidden="true" style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 24px"><div style="display: flex; align-items: center; gap: 4px; margin-left: -8px"><a href="Rebost.dc.html" aria-label="Tanca" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #2B2418; text-decoration: none"><span class="ms" style="font-size: 24px">close</span></a><h1 style="flex: 1; margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 700; font-stretch: 85%">Nova categoria</h1><a href="Rebost.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 22px; background: #2E6B3B; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 700">Desa</a></div><div style="height: 140px"></div><div style="height: 60px; border-radius: 16px; background: #F0E2CB"></div></div><div style="position: absolute; inset: 0; background: rgba(41,36,28,0.45)"></div><div role="dialog" aria-labelledby="asp-t" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 24px; border-radius: 32px 32px 0 0; background: #FFFAEE; display: flex; flex-direction: column; gap: 18px"><div style="align-self: center; width: 32px; height: 4px; border-radius: 2px; background: #8F8266"></div><div style="display: flex; align-items: center; gap: 16px"><div style="position: relative; width: 72px; height: 72px; flex: none; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="{{sel}}" fill="#EFD8C0"></path></svg><span class="ms" style="position: relative; font-size: 34px; color: #2E6B3B">local_drink</span></div><div><h2 id="asp-t" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 700; font-stretch: 85%">Aspecte</h2><div style="font-size: 14px; color: #6A5D45; margin-top: 2px">Begudes · com es veu al Rebost</div></div></div><div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #6A5D45; padding: 0 4px">Forma</div><div role="radiogroup" aria-label="Forma" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px"><sc-for list="{{shapes}}" as="s" hint-placeholder-count="6"><button role="radio" aria-checked="{{s.on}}" aria-label="{{s.name}}" style="height: 52px; border: {{s.border}}; border-radius: 16px; background: {{s.bg}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg viewBox="0 0 100 100" aria-hidden="true" style="width: 34px; height: 34px"><path d="{{s.d}}" fill="{{s.fill}}"></path></svg></button></sc-for></div></div><div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #6A5D45; padding: 0 4px">Icona</div><div role="radiogroup" aria-label="Icona" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px"><sc-for list="{{icons}}" as="i" hint-placeholder-count="12"><button role="radio" aria-checked="{{i.on}}" aria-label="{{i.name}}" style="height: 48px; border: none; border-radius: 24px; background: {{i.bg}}; color: {{i.fg}}; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 22px">{{i.name}}</span></button></sc-for></div></div><a href="NovaCategoria.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 28px; background: #2E6B3B; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 700"><span class="ms" style="font-size: 22px">check</span>Fet</a></div></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  blob(n, a, rot) {
    rot = rot || 0;
    var p = [];
    for (var i = 0; i < 120; i++) {
      var t = i / 120 * Math.PI * 2;
      var r = 50 - a + a * Math.cos(n * (t + rot));
      p.push((50 + r * Math.cos(t)).toFixed(1) + " " + (50 + r * Math.sin(t)).toFixed(1));
    }
    return "M" + p.join("L") + "Z";
  }
  renderVals() {
    var self = this;
    var sh = [["Galeta", 9, 3, 0], ["Pentàgon", 5, 4, 0], ["Trèvol", 4, 8, Math.PI / 4], ["Sol", 8, 4, 0], ["Coixí", 4, 2.5, Math.PI / 4], ["Segell", 12, 3, 0]];
    var shapes = sh.map(function (s, k) { var on = k === 5; return { name: s[0], d: self.blob(s[1], s[2], s[3]), on: on ? "true" : "false", bg: on ? "#DCE9C6" : "#F7EEDA", border: on ? "2px solid #2E6B3B" : "none", fill: on ? "#2E6B3B" : "#CDBFA6" }; });
    var names = ["local_drink", "local_cafe", "liquor", "icecream", "egg", "rice_bowl", "cookie", "soup_kitchen", "kebab_dining", "lunch_dining", "breakfast_dining", "eco"];
    var icons = names.map(function (n, k) { var on = k === 0; return { name: n, on: on ? "true" : "false", bg: on ? "#2E6B3B" : "#F7EEDA", fg: on ? "#FFFFFF" : "#2E6B3B" }; });
    return { shapes: shapes, icons: icons, sel: this.blob(12, 3, 0) };
  }
}
</script>
