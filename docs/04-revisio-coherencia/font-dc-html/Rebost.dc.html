<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Rebost</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Figtree:wght@400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E6B3B}a:hover{color:#10300F}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'opsz' 24;display:inline-block}
.msf{font-variation-settings:'FILL' 1,'wght' 400,'opsz' 24}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFAEE; font-family: 'Figtree', sans-serif; color: #2B2418">
  <div style="padding: 28px 20px 140px; display: flex; flex-direction: column; gap: 18px">

    <div>
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #6A5D45">61 productes · 5 categories</div>
      <h1 style="margin: 6px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 44px; font-weight: 800; font-stretch: 80%; line-height: 1; letter-spacing: -0.5px">Rebost</h1>
    </div>

    <label style="position: relative; display: block">
      <span class="ms" style="position: absolute; left: 18px; top: 15px; font-size: 22px; color: #6A5D45">search</span>
      <input type="search" aria-label="Cerca un producte" placeholder="Cerca un producte" style="width: 100%; box-sizing: border-box; height: 52px; border: none; border-radius: 26px; background: #F0E2CB; padding: 0 20px 0 52px; font-family: 'Figtree', sans-serif; font-size: 16px; color: #2B2418">
    </label>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
        <a href="Categoria.dc.html" style="display: flex; flex-direction: column; gap: 10px; min-height: 178px; box-sizing: border-box; padding: 16px; border-radius: 28px; background: #F7EEDA; color: #2B2418; text-decoration: none">
          <div style="display: flex; justify-content: space-between; align-items: flex-start">
            <div style="position: relative; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center">
              <svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="{{c.shape}}" fill="#EFD8C0"></path></svg>
              <span class="ms" style="position: relative; font-size: 26px; color: #2E6B3B">{{c.icon}}</span>
            </div>
            <sc-if value="{{c.hasExp}}" hint-placeholder-val="{{ false }}">
              <span style="padding: 4px 8px; border-radius: 10px; background: #F7D8CC; color: #7A2414; font-size: 12px; font-weight: 700">{{c.expLabel}}</span>
            </sc-if>
          </div>
          <div style="flex: 1">
            <div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700; font-stretch: 85%; line-height: 1.1">{{c.name}}</div>
            <div style="font-size: 13px; color: #6A5D45; margin-top: 4px">{{c.count}} productes · {{c.next}}</div>
          </div>
          <div style="display: flex; gap: 2px; height: 8px" aria-hidden="true">
            <sc-for list="{{c.bar}}" as="b" hint-placeholder-count="3">
              <div style="flex: {{b.n}}; background: {{b.c}}; border-radius: 4px"></div>
            </sc-for>
          </div>
        </a>
      </sc-for>
      <a href="NovaCategoria.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 178px; box-sizing: border-box; border-radius: 28px; border: 2px dashed #CDBFA6; color: #2E6B3B; text-decoration: none; font-size: 15px; font-weight: 700"><span class="ms" style="font-size: 28px">add</span>Nova categoria</a>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <nav aria-label="Navegació principal" style="display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 32px; background: #DCE9C6; box-shadow: 0 6px 20px rgba(41,36,28,0.18)">
      <a href="Main.dc.html" aria-label="Aviat" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #10300F; text-decoration: none"><span class="ms" style="font-size: 24px">hourglass_bottom</span></a>
      <a href="Rebost.dc.html" style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 18px 0 14px; border-radius: 24px; background: #2E6B3B; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 700"><span class="ms msf" style="font-size: 22px">kitchen</span>Rebost</a>
      <a href="Ajustos.dc.html" aria-label="Ajustos" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #10300F; text-decoration: none"><span class="ms" style="font-size: 24px">settings</span></a>
    </nav>
    <a href="Afegir.dc.html" aria-label="Afegeix un producte" style="width: 64px; height: 64px; flex: none; border-radius: 20px; background: #2E6B3B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 6px 20px rgba(41,36,28,0.18)"><span class="ms" style="font-size: 30px">add</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  blob(n, a, rot) {
    rot = rot || 0;
    var p = [];
    for (var i = 0; i < 120; i++) {
      var t = i / 120 * Math.PI * 2;
      var r = 50 - a + a * Math.cos(n * (t + rot));
      p.push((50 + r * Math.cos(t)).toFixed(1) + " " + (50 + r * Math.sin(t)).toFixed(1));
    }
    return "M" + p.join("L") + "Z";
  }
  renderVals() {
    var cols = ["#B23F2A", "#D9A23A", "#7E9B4C", "#4F8FA3"];
    var raw = [
      ["Làctics", "water_full", this.blob(9, 3, 0), [1, 4, 8, 1], "propera, avui"],
      ["Fruita i verdura", "nutrition", this.blob(6, 6, 0), [2, 2, 14, 0], "propera, avui"],
      ["Carn i peix", "set_meal", this.blob(4, 8, Math.PI / 4), [3, 1, 3, 2], "propera, demà"],
      ["Rebost", "grocery", this.blob(8, 4, 0), [1, 1, 15, 0], "propera, dc. 14"],
      ["Fleca", "bakery_dining", this.blob(4, 2.5, Math.PI / 4), [0, 1, 2, 0], "propera, dc. 14"]
    ];
    var cats = raw.map(function (c) {
      var bar = [];
      c[3].forEach(function (n, i) { if (n > 0) bar.push({ n: n, c: cols[i] }); });
      var count = c[3].reduce(function (a, b) { return a + b; }, 0);
      return { name: c[0], icon: c[1], shape: c[2], bar: bar, count: count, next: c[4], expLabel: c[3][0] + (c[3][0] === 1 ? " caducat" : " caducats"), hasExp: c[3][0] > 0 };
    });
    return { cats: cats };
  }
}
</script>
</body>
</html>
