<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Afegeix · producte nou</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Figtree:wght@400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E6B3B}a:hover{color:#10300F}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'opsz' 24;display:inline-block}
.msf{font-variation-settings:'FILL' 1,'wght' 400,'opsz' 24}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFAEE; font-family: 'Figtree', sans-serif; color: #2B2418">
  <div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; align-items: center; gap: 4px; margin-left: -8px">
      <a href="Main.dc.html" aria-label="Tanca" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #2B2418; text-decoration: none"><span class="ms" style="font-size: 24px">close</span></a>
      <h1 style="flex: 1; margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 700; font-stretch: 85%">Afegeix</h1>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="nom3" style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #6A5D45; padding: 0 4px">Nom</label>
      <input id="nom3" value="Kombucha" autocomplete="off" aria-describedby="nou" style="width: 100%; box-sizing: border-box; height: 60px; border: 2px solid #2E6B3B; border-radius: 16px; background: #F0E2CB; padding: 0 18px; font-family: 'Figtree', sans-serif; font-size: 19px; font-weight: 600; color: #2B2418">
      <div id="nou" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: #DCE9C6; color: #10300F; font-size: 14px">
        <span class="ms" style="font-size: 20px">add_circle</span>
        <span><b>Producte nou.</b> Tria'n la categoria i la data.</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #6A5D45; padding: 0 4px">Categoria</div>
      <div role="radiogroup" aria-label="Categoria" style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
          <button role="radio" aria-checked="false" style="flex: none; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px 0 5px; border: 1px solid #E0D2B2; border-radius: 22px; background: transparent; color: #2B2418; font-family: 'Figtree', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">
            <span style="position: relative; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center">
              <svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="{{c.shape}}" fill="#EFD8C0"></path></svg>
              <span class="ms" style="position: relative; font-size: 18px; color: #2E6B3B">{{c.icon}}</span>
            </span>{{c.name}}
          </button>
        </sc-for>
        <a href="AfegirNovaCat.dc.html" style="display: flex; align-items: center; gap: 4px; height: 44px; box-sizing: border-box; padding: 0 16px 0 10px; border: 2px dashed #2E6B3B; border-radius: 22px; background: #DCE9C6; color: #10300F; text-decoration: none; font-size: 15px; font-weight: 700"><span class="ms" style="font-size: 20px">add</span>Nova</a>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="data3" style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #6A5D45; padding: 0 4px">Caduca</label>
      <div style="display: flex; align-items: center; gap: 12px; height: 72px; box-sizing: border-box; padding: 0 8px 0 18px; border-radius: 16px; background: #F0E2CB">
        <input id="data3" inputmode="numeric" placeholder="dd / mm / aa" style="flex: 1; min-width: 0; border: none; background: transparent; font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; font-weight: 800; font-stretch: 80%; color: #2B2418; padding: 0">
        <button aria-label="Obre el calendari" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: #FFFAEE; color: #2E6B3B; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 22px">calendar_month</span></button>
      </div>
      <div style="display: flex; gap: 8px; overflow: hidden; margin-right: -20px">
        <button style="flex: none; height: 40px; padding: 0 14px; border: 1px solid #E0D2B2; border-radius: 12px; background: transparent; font-family: 'Figtree', sans-serif; font-size: 14px; font-weight: 600; color: #2B2418">Demà</button>
        <button style="flex: none; height: 40px; padding: 0 14px; border: 1px solid #E0D2B2; border-radius: 12px; background: transparent; font-family: 'Figtree', sans-serif; font-size: 14px; font-weight: 600; color: #2B2418">+3 dies</button>
        <button style="flex: none; height: 40px; padding: 0 14px; border: 1px solid #E0D2B2; border-radius: 12px; background: transparent; font-family: 'Figtree', sans-serif; font-size: 14px; font-weight: 600; color: #2B2418">+1 setmana</button>
        <button style="flex: none; height: 40px; padding: 0 14px; border: 1px solid #E0D2B2; border-radius: 12px; background: transparent; font-family: 'Figtree', sans-serif; font-size: 14px; font-weight: 600; color: #2B2418">+2 setmanes</button>
        <button style="flex: none; height: 40px; padding: 0 14px; border: 1px solid #E0D2B2; border-radius: 12px; background: transparent; font-family: 'Figtree', sans-serif; font-size: 14px; font-weight: 600; color: #2B2418">+1 mes</button>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 100px; text-align: center; font-size: 13px; color: #6A5D45">Falten la categoria i la data per desar</div>
  <div style="position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex">
    <button disabled style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border: none; border-radius: 28px; background: #F0E2CB; color: #8F8266; font-family: 'Figtree', sans-serif; font-size: 17px; font-weight: 700"><span class="ms" style="font-size: 22px">check</span>Desa</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  blob(n, a, rot) {
    rot = rot || 0;
    var p = [];
    for (var i = 0; i < 120; i++) {
      var t = i / 120 * Math.PI * 2;
      var r = 50 - a + a * Math.cos(n * (t + rot));
      p.push((50 + r * Math.cos(t)).toFixed(1) + " " + (50 + r * Math.sin(t)).toFixed(1));
    }
    return "M" + p.join("L") + "Z";
  }
  renderVals() {
    var raw = [
      ["Làctics", "water_full", this.blob(9, 3, 0)],
      ["Fruita i verdura", "nutrition", this.blob(6, 6, 0)],
      ["Carn i peix", "set_meal", this.blob(4, 8, Math.PI / 4)],
      ["Secs i conserves", "grocery", this.blob(8, 4, 0)],
      ["Fleca", "bakery_dining", this.blob(4, 2.5, Math.PI / 4)]
    ];
    return { cats: raw.map(function (c) { return { name: c[0], icon: c[1], shape: c[2] }; }) };
  }
}
</script>
</body>
</html>
