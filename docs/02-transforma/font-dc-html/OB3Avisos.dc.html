<style>
body{margin:0}
a{color:#2E6B3B}a:hover{color:#10300F}
@keyframes rise{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drop{0%{transform:translateY(-140px);opacity:0}60%{transform:translateY(6px);opacity:1}100%{transform:none;opacity:1}}
.grow{transform-origin:left center;animation:grow 600ms cubic-bezier(.2,.9,.3,1) 100ms both}
.rise{animation:rise 520ms cubic-bezier(.2,.9,.3,1) both}
.drop{animation:drop 900ms cubic-bezier(.3,1.3,.5,1) 350ms both}
.d1{animation-delay:120ms}.d2{animation-delay:240ms}.d3{animation-delay:360ms}.d4{animation-delay:480ms}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  blob(n, a, rot) {
    rot = rot || 0;
    var p = [];
    for (var i = 0; i < 120; i++) {
      var t = i / 120 * Math.PI * 2;
      var r = 50 - a + a * Math.cos(n * (t + rot));
      p.push((50 + r * Math.cos(t)).toFixed(1) + " " + (50 + r * Math.sin(t)).toFixed(1));
    }
    return "M" + p.join("L") + "Z";
  }
  renderVals() {
    return { cookie: this.blob(9, 3, 0) };
  }
}
</script>
