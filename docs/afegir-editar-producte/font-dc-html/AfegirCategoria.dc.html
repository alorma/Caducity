olor: #6A5D45; margin-top: 4px">On el guardes?</div></div><div role="radiogroup" aria-label="Categoria" style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{cats}}" as="c" hint-placeholder-count="6"><button role="radio" aria-checked="{{c.sel}}" style="flex: none; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 16px 0 6px; border: {{c.border}}; border-radius: 26px; background: {{c.bg}}; color: #2B2418; font-family: 'Figtree', sans-serif; font-size: 16px; font-weight: 600"><span style="position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="{{c.shape}}" fill="{{c.fill}}"></path></svg><span class="ms" style="position: relative; font-size: 20px; color: {{c.ic}}">{{c.icon}}</span></span>{{c.name}}</button></sc-for><a href="NovaCategoria.dc.html" style="display: flex; align-items: center; gap: 4px; height: 52px; box-sizing: border-box; padding: 0 18px 0 12px; border: 1px dashed #8F8266; border-radius: 26px; color: #2E6B3B; text-decoration: none; font-size: 16px; font-weight: 700"><span class="ms" style="font-size: 20px">add</span>Nova</a></div><div style="font-size: 13px; color: #6A5D45; padding: 0 4px">Tocar una categoria la tria i tanca. «Nova» obre la pantalla de categoria.</div></div></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  blob(n, a, rot) {
    rot = rot || 0;
    var p = [];
    for (var i = 0; i < 120; i++) {
      var t = i / 120 * Math.PI * 2;
      var r = 50 - a + a * Math.cos(n * (t + rot));
      p.push((50 + r * Math.cos(t)).toFixed(1) + " " + (50 + r * Math.sin(t)).toFixed(1));
    }
    return "M" + p.join("L") + "Z";
  }
  renderVals() {
    var raw = [
      ["Làctics", "water_full", this.blob(9, 3, 0)],
      ["Fruita i verdura", "nutrition", this.blob(5, 4, 0)],
      ["Carn i peix", "set_meal", this.blob(4, 8, Math.PI / 4)],
      ["Secs i conserves", "grocery", this.blob(8, 4, 0)],
      ["Fleca", "bakery_dining", this.blob(4, 2.5, Math.PI / 4)],
      ["Plats preparats", "soup_kitchen", this.blob(10, 2.5, 0)]
    ];
    var SEL = -1;
    var cats = raw.map(function (c, k) { var on = k === SEL; return { name: c[0], icon: c[1], shape: c[2], sel: on ? "true" : "false", bg: on ? "#DCE9C6" : "transparent", border: on ? "2px solid #2E6B3B" : "1px solid #E0D2B2", fill: on ? "#2E6B3B" : "#EFD8C0", ic: on ? "#FFFFFF" : "#2E6B3B" }; });
    return { cats: cats, lac: this.blob(9, 3, 0), plats: this.blob(10, 2.5, 0) };
  }
}
</script>
