<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Splash</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';font-variation-settings:'FILL' 1,'wght' 500,'opsz' 48;display:inline-block}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF6EC; display: flex; align-items: center; justify-content: center">
  <div style="position: relative; width: 192px; height: 192px; border-radius: 96px; background: #E8B95A; display: flex; align-items: center; justify-content: center; overflow: hidden">
    <svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; width: 128px; height: 128px"><path d="{{cookie}}" fill="#4D5A1E"></path></svg>
    <span class="ms" style="position: relative; font-size: 68px; color: #FBF6EC">eco</span>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; font-stretch: 80%; color: #4D5A1E">Caducity</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  blob(n, a, rot) {
    rot = rot || 0;
    var p = [];
    for (var i = 0; i < 120; i++) {
      var t = i / 120 * Math.PI * 2;
      var r = 50 - a + a * Math.cos(n * (t + rot));
      p.push((50 + r * Math.cos(t)).toFixed(1) + " " + (50 + r * Math.sin(t)).toFixed(1));
    }
    return "M" + p.join("L") + "Z";
  }
  renderVals() {
    return { cookie: this.blob(9, 3, 0) };
  }
}
</script>
</body>
</html>
