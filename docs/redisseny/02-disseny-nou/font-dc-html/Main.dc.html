<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Inici · Què caduca</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Figtree:wght@400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:#4D5A1E}a:hover{color:#283010}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'opsz' 24;display:inline-block}
.msf{font-variation-settings:'FILL' 1,'wght' 400,'opsz' 24}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF6EC; font-family: 'Figtree', sans-serif; color: #29241C">
  <div style="padding: 28px 20px 140px; display: flex; flex-direction: column; gap: 20px">

    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
      <div>
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #665C4C">Diumenge, 11 d'octubre</div>
        <h1 style="margin: 6px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 44px; font-weight: 800; font-stretch: 80%; line-height: 1; letter-spacing: -0.5px">Què caduca</h1>
      </div>
      <button aria-label="Cerca" style="width: 48px; height: 48px; flex: none; border: none; border-radius: 24px; background: #ECE2CF; color: #29241C; display: flex; align-items: center; justify-content: center; cursor: pointer"><span class="ms" style="font-size: 24px">search</span></button>
    </div>

    <a href="Caducats.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 12px 14px 12px 12px; border-radius: 24px; background: #F7D8CC; color: #7A2414; text-decoration: none">
      <div style="position: relative; width: 48px; height: 48px; flex: none; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="{{burst}}" fill="#B23F2A"></path></svg>
        <span class="ms msf" style="position: relative; font-size: 24px; color: #FFFFFF">delete_history</span>
      </div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 17px; font-weight: 700">7 productes caducats</div>
        <div style="font-size: 13px; margin-top: 2px">El més antic, fa 5 dies</div>
      </div>
      <span style="display: flex; align-items: center; gap: 2px; font-size: 14px; font-weight: 700">Revisa<span class="ms" style="font-size: 20px">chevron_right</span></span>
    </a>

    <div style="display: flex; gap: 3px">
      <a href="Caducats.dc.html" style="flex: 1; padding: 12px 14px; border-radius: 20px 8px 8px 20px; background: #F8E2AE; color: #5C3F00; text-decoration: none">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800; font-stretch: 80%; line-height: 1">9</div>
        <div style="font-size: 13px; font-weight: 600; margin-top: 4px">Aviat</div>
      </a>
      <a href="Rebost.dc.html" style="flex: 1; padding: 12px 14px; border-radius: 8px; background: #DCE8C4; color: #2F4515; text-decoration: none">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800; font-stretch: 80%; line-height: 1">42</div>
        <div style="font-size: 13px; font-weight: 600; margin-top: 4px">Frescos</div>
      </a>
      <a href="Rebost.dc.html" style="flex: 1; padding: 12px 14px; border-radius: 8px 20px 20px 8px; background: #D3E5EA; color: #163F4C; text-decoration: none">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800; font-stretch: 80%; line-height: 1">3</div>
        <div style="font-size: 13px; font-weight: 600; margin-top: 4px">Congelats</div>
      </a>
    </div>

    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: baseline; gap: 8px; padding: 0 4px">
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700; font-stretch: 85%">{{sec.title}}</h2>
          <span style="font-size: 13px; color: #665C4C">{{sec.sub}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 14px; min-height: 68px; box-sizing: border-box; padding: 10px 10px 10px 12px; background: #F4ECDD; border-radius: {{r.rad}}">
              <div style="position: relative; width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center">
                <svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="{{r.shape}}" fill="#E6DBC5"></path></svg>
                <span class="ms" style="position: relative; font-size: 22px; color: #4D5A1E">{{r.icon}}</span>
              </div>
              <div style="flex: 1; min-width: 0">
                <div style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</div>
                <div style="font-size: 13px; color: #665C4C; margin-top: 2px">{{r.meta}}</div>
              </div>
              <button aria-label="Marca com a consumit" style="width: 44px; height: 44px; flex: none; border: none; border-radius: 22px; background: #FBF6EC; color: #4D5A1E; display: flex; align-items: center; justify-content: center; cursor: pointer"><span class="ms" style="font-size: 22px">check</span></button>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <nav aria-label="Navegació principal" style="display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 32px; background: #DCE3B0; box-shadow: 0 6px 20px rgba(41,36,28,0.18)">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 18px 0 14px; border-radius: 24px; background: #4D5A1E; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 700"><span class="ms msf" style="font-size: 22px">hourglass_bottom</span>Aviat</a>
      <a href="Rebost.dc.html" aria-label="Rebost" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #283010; text-decoration: none"><span class="ms" style="font-size: 24px">kitchen</span></a>
      <a href="Ajustos.dc.html" aria-label="Ajustos" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #283010; text-decoration: none"><span class="ms" style="font-size: 24px">settings</span></a>
    </nav>
    <a href="Afegir.dc.html" aria-label="Afegeix un producte" style="width: 64px; height: 64px; border-radius: 20px; background: #4D5A1E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 6px 20px rgba(41,36,28,0.18)"><span class="ms" style="font-size: 30px">add</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  blob(n, a, rot) {
    rot = rot || 0;
    var p = [];
    for (var i = 0; i < 120; i++) {
      var t = i / 120 * Math.PI * 2;
      var r = 50 - a + a * Math.cos(n * (t + rot));
      p.push((50 + r * Math.cos(t)).toFixed(1) + " " + (50 + r * Math.sin(t)).toFixed(1));
    }
    return "M" + p.join("L") + "Z";
  }
  rad(i, n) {
    if (n === 1) return "24px";
    if (i === 0) return "24px 24px 6px 6px";
    if (i === n - 1) return "6px 6px 24px 24px";
    return "6px";
  }
  renderVals() {
    var S = {
      cookie: this.blob(9, 3, 0), flower: this.blob(6, 6, 0), clover: this.blob(4, 8, Math.PI / 4),
      sunny: this.blob(8, 4, 0), soft: this.blob(4, 2.5, Math.PI / 4), burst: this.blob(12, 3, 0)
    };
    var C = {
      lac: { cat: "Làctics", icon: "water_full", shape: S.cookie },
      fru: { cat: "Fruita i verdura", icon: "nutrition", shape: S.flower },
      car: { cat: "Carn i peix", icon: "set_meal", shape: S.clover },
      reb: { cat: "Rebost", icon: "grocery", shape: S.sunny },
      fle: { cat: "Fleca", icon: "bakery_dining", shape: S.soft }
    };
    var self = this;
    var raw = [
      { title: "Avui", sub: "2 productes", rows: [["Llet sencera", "lac", "1 brick"], ["Espinacs", "fru", "1 bossa"]] },
      { title: "Demà", sub: "dilluns 12 · 3 productes", rows: [["Pernil dolç", "car", "150 g"], ["Maduixes", "fru", "1 safata"], ["Mozzarella", "lac", "1 unitat"]] },
      { title: "Dimarts 13", sub: "2 productes", rows: [["Iogurt natural", "lac", "2 unitats"]] },
      { title: "Dimecres 14", sub: "2 productes", rows: [["Hummus", "reb", "1 pot"], ["Pa de motlle", "fle", "1 paquet"]] }
    ];
    var sections = raw.map(function (s) {
      return {
        title: s.title, sub: s.sub,
        rows: s.rows.map(function (r, i) {
          var c = C[r[1]];
          return { name: r[0], meta: c.cat + " · " + r[2], icon: c.icon, shape: c.shape, rad: self.rad(i, s.rows.length) };
        })
      };
    });
    return { sections: sections, burst: S.burst };
  }
}
</script>
</body>
</html>
