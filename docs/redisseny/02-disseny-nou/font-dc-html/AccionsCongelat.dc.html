<style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFAEE; font-family: 'Figtree', sans-serif; color: #2B2418">

  </div>

  <div style="position: absolute; inset: 0; background: rgba(41,36,28,0.45)"></div>

  <div role="dialog" aria-labelledby="ac-titol" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 28px; border-radius: 32px 32px 0 0; background: #FFFAEE; display: flex; flex-direction: column; gap: 20px">
    <div style="align-self: center; width: 32px; height: 4px; border-radius: 2px; background: #8F8266"></div>

    <div style="display: flex; align-items: center; gap: 14px">
      <div style="position: relative; width: 56px; height: 56px; flex: none; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="{{cookie}}" fill="#EFD8C0"></path></svg>
        <span class="ms" style="position: relative; font-size: 26px; color: #2E6B3B">water_full</span>

      <div style="flex: 1; min-width: 0">

    </div>

    <div style="display: flex; gap: 3px">
      <button style="flex: 1.4; display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border: none; border-radius: 28px 8px 8px 28px; background: #2E6B3B; color: #FFFFFF; font-family: 'Figtree', sans-serif; font-size: 17px; font-weight: 700"><span class="ms" style="font-size: 24px">check</span>Consumeix</button>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  blob(n, a, rot) {
    rot = rot || 0;
    var p = [];
    for (var i = 0; i < 120; i++) {
      var t = i / 120 * Math.PI * 2;
      var r = 50 - a + a * Math.cos(n * (t + rot));
      p.push((50 + r * Math.cos(t)).toFixed(1) + " " + (50 + r * Math.sin(t)).toFixed(1));
    }
    return "M" + p.join("L") + "Z";
  }
  renderVals() {
    return { cookie: this.blob(9, 3, 0) };
  }
}
</script>
