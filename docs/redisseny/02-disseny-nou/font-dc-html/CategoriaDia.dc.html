<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Categoria · dia seleccionat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Figtree:wght@400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:#4D5A1E}a:hover{color:#283010}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'opsz' 24;display:inline-block}
.msf{font-variation-settings:'FILL' 1,'wght' 400,'opsz' 24}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF6EC; font-family: 'Figtree', sans-serif; color: #29241C">
  <div style="padding: 16px 20px 120px; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; justify-content: space-between; align-items: center; margin: 0 -8px">
      <a href="Rebost.dc.html" aria-label="Torna" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #29241C; text-decoration: none"><span class="ms" style="font-size: 24px">arrow_back</span></a>
      <div style="display: flex">
        <a href="CalMes.dc.html" aria-label="Calendari de Làctics" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #29241C; text-decoration: none"><span class="ms" style="font-size: 24px">calendar_month</span></a>
        <button aria-label="Més opcions" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: transparent; color: #29241C; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 24px">more_vert</span></button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px">
      <div style="position: relative; width: 80px; height: 80px; flex: none; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="{{cookie}}" fill="#E6DBC5"></path></svg>
        <span class="ms" style="position: relative; font-size: 36px; color: #4D5A1E">water_full</span>
      </div>
      <div>
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; font-weight: 800; font-stretch: 80%; line-height: 1.05">Làctics</h1>
        <div style="font-size: 14px; color: #665C4C; margin-top: 4px">14 productes · propera, avui</div>
      </div>
    </div>

    <div role="tablist" aria-label="Pròxims 7 dies a Làctics" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: -4px -4px 0">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <button role="tab" aria-selected="{{d.sel}}" aria-label="{{d.label}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0 8px; border: none; border-radius: 18px; background: {{d.bg}}; color: {{d.fg}}; font-family: 'Figtree', sans-serif; cursor: pointer">
          <span style="font-size: 12px; font-weight: 600; color: {{d.wdFg}}">{{d.wd}}</span>
          <span style="width: 34px; height: 34px; box-sizing: border-box; border-radius: 17px; border: {{d.ring}}; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800">{{d.n}}</span>
          <span style="display: flex; gap: 3px; height: 6px">
            <sc-for list="{{d.dots}}" as="c" hint-placeholder-count="1">
              <span style="width: 6px; height: 6px; border-radius: 3px; background: {{c}}"></span>
            </sc-for>
          </span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 8px">
      <button aria-label="Treu el filtre del dia" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 8px 0 12px; border: none; border-radius: 12px; background: #4D5A1E; color: #FFFFFF; font-family: 'Figtree', sans-serif; font-size: 14px; font-weight: 700"><span class="ms" style="font-size: 18px">event</span>Dimecres 14<span class="ms" style="font-size: 18px; margin-left: 2px">close</span></button>
      <span style="font-size: 13px; color: #665C4C">3 unitats caduquen aquest dia</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <a href="Accions.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; box-sizing: border-box; padding: 10px 12px 10px 16px; background: #F4ECDD; border-radius: {{r.rad}}; color: #29241C; text-decoration: none">
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 16px; font-weight: 600">{{r.name}}</div>
            <div style="font-size: 13px; color: #665C4C; margin-top: 2px">{{r.meta}}</div>
          </div>
          <span style="flex: none; padding: 6px 10px; border-radius: 12px; background: #F8E2AE; color: #5C3F00; font-size: 13px; font-weight: 700">3 dies</span>
        </a>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 0 4px; font-size: 13px; color: #665C4C">
      <span class="ms" style="font-size: 18px">touch_app</span>
      Toca el dia o la ✕ per tornar a veure-ho tot.
    </div>
  </div>

  <a href="Afegir.dc.html" style="position: absolute; right: 20px; bottom: 24px; display: flex; align-items: center; gap: 10px; height: 64px; padding: 0 24px 0 20px; border-radius: 20px; background: #4D5A1E; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 700; box-shadow: 0 6px 20px rgba(41,36,28,0.18)"><span class="ms" style="font-size: 26px">add</span>Afegeix</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  blob(n, a, rot) {
    rot = rot || 0;
    var p = [];
    for (var i = 0; i < 120; i++) {
      var t = i / 120 * Math.PI * 2;
      var r = 50 - a + a * Math.cos(n * (t + rot));
      p.push((50 + r * Math.cos(t)).toFixed(1) + " " + (50 + r * Math.sin(t)).toFixed(1));
    }
    return "M" + p.join("L") + "Z";
  }
  renderVals() {
    var A = "#D9A23A";
    var week = [
      ["dg", 11, [A], "Avui, 1 producte"], ["dl", 12, [A, A], "Demà, 2 productes"],
      ["dt", 13, [A, A], "Dimarts 13, 2 unitats"], ["dc", 14, [A, A, A], "Dimecres 14, 3 unitats, seleccionat"],
      ["dj", 15, [], "Dijous 15, res"], ["dv", 16, [], "Divendres 16, res"], ["ds", 17, [], "Dissabte 17, res"]
    ];
    var days = week.map(function (d, i) {
      var sel = i === 3, today = i === 0;
      return {
        wd: d[0], n: d[1], dots: d[2], label: d[3], sel: sel ? "true" : "false",
        bg: sel ? "#4D5A1E" : (today ? "#F4ECDD" : "transparent"),
        fg: sel ? "#FFFFFF" : "#29241C",
        wdFg: sel ? "#DCE3B0" : "#665C4C",
        ring: today ? "2px solid #29241C" : "2px solid transparent"
      };
    });
    var raw = [
      ["Formatge cheddar", "Unitat 3 de 3 · dc. 14 oct"],
      ["Llet sencera", "Unitat 3 de 3 · dc. 14 oct"],
      ["Mató", "1 unitat · dc. 14 oct"]
    ];
    var rows = raw.map(function (r, i) {
      var rad = i === 0 ? "24px 24px 6px 6px" : (i === raw.length - 1 ? "6px 6px 24px 24px" : "6px");
      return { name: r[0], meta: r[1], rad: rad };
    });
    return { days: days, rows: rows, cookie: this.blob(9, 3, 0) };
  }
}
</script>
</body>
</html>
