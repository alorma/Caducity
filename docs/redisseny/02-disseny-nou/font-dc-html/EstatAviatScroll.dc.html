<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Aviat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Figtree:wght@400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:#4D5A1E}a:hover{color:#283010}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'opsz' 24;display:inline-block}
.msf{font-variation-settings:'FILL' 1,'wght' 400,'opsz' 24}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF6EC; font-family: 'Figtree', sans-serif; color: #29241C">

  <div role="banner" style="position: absolute; z-index: 2; top: 0; left: 0; right: 0; height: 72px; box-sizing: border-box; padding: 12px 8px 12px 4px; border-radius: 0 0 24px 24px; background: #F8E2AE; color: #5C3F00; display: flex; align-items: center; gap: 4px; box-shadow: 0 2px 10px rgba(41,36,28,0.12)">
    <a href="EstatAviat.dc.html" aria-label="Torna" style="width: 48px; height: 48px; flex: none; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #5C3F00; text-decoration: none"><span class="ms" style="font-size: 24px">arrow_back</span></a>
    <div style="flex: 1; min-width: 0">
      <div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800; font-stretch: 80%; line-height: 1.05">Aviat</div>
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; margin-top: 2px">9 productes</div>
    </div>
    <div style="display: flex; gap: 4px"><button aria-label="Selecciona" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: transparent; color: #5C3F00; display: flex; align-items: center; justify-content: center; flex: none"><span class="ms" style="font-size: 24px">checklist</span></button></div>
  </div>

  <div style="padding: 20px 20px 40px; display: flex; flex-direction: column; gap: 18px; transform: translateY(-80px)">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 10px; padding: 0 4px">
          <span style="position: relative; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center">
            <svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="{{g.shape}}" fill="#E6DBC5"></path></svg>
            <span class="ms" style="position: relative; font-size: 16px; color: #4D5A1E">{{g.icon}}</span>
          </span>
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 700; font-stretch: 85%">{{g.name}}</h2>
          <span style="font-size: 13px; color: #665C4C">{{g.count}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 8px; min-height: 64px; box-sizing: border-box; padding: 8px 6px 8px 16px; background: #F4ECDD; border-radius: {{r.rad}}">
              <div style="flex: 1; min-width: 0">
                <div style="font-size: 16px; font-weight: 600">{{r.name}}</div>
                <div style="font-size: 13px; color: #5C3F00; margin-top: 2px; font-weight: 600">{{r.when}}</div>
              </div>
              <button aria-label="Marca com a consumit" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #FBF6EC; color: #4D5A1E; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 22px">check</span></button>
              <button aria-label="Congela" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #FBF6EC; color: #3F7F92; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 22px">ac_unit</span></button>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  blob(n, a, rot) {
    rot = rot || 0;
    var p = [];
    for (var i = 0; i < 120; i++) {
      var t = i / 120 * Math.PI * 2;
      var r = 50 - a + a * Math.cos(n * (t + rot));
      p.push((50 + r * Math.cos(t)).toFixed(1) + " " + (50 + r * Math.sin(t)).toFixed(1));
    }
    return "M" + p.join("L") + "Z";
  }
  rad(i, n) {
    if (n === 1) return "24px";
    if (i === 0) return "24px 24px 6px 6px";
    if (i === n - 1) return "6px 6px 24px 24px";
    return "6px";
  }
  renderVals() {
    var self = this;
    var raw = [
      ["Làctics", "water_full", this.blob(9, 3, 0), [["Llet sencera", "Avui · dg. 11 oct"], ["Mozzarella", "Demà · dl. 12 oct"], ["Iogurt natural · 2 unitats", "D'aquí 2 dies · dt. 13 oct"]]],
      ["Fruita i verdura", "nutrition", this.blob(6, 6, 0), [["Espinacs", "Avui · dg. 11 oct"], ["Maduixes", "Demà · dl. 12 oct"]]],
      ["Carn i peix", "set_meal", this.blob(4, 8, Math.PI / 4), [["Pernil dolç", "Demà · dl. 12 oct"]]],
      ["Rebost", "grocery", this.blob(8, 4, 0), [["Hummus", "D'aquí 3 dies · dc. 14 oct"]]],
      ["Fleca", "bakery_dining", this.blob(4, 2.5, Math.PI / 4), [["Pa de motlle", "D'aquí 3 dies · dc. 14 oct"]]]
    ];
    var groups = raw.map(function (g) {
      return {
        name: g[0], icon: g[1], shape: g[2], count: String(g[3].length),
        rows: g[3].map(function (r, i) { return { name: r[0], when: r[1], rad: self.rad(i, g[3].length) }; })
      };
    });
    return { groups: groups };
  }
}
</script>
</body>
</html>
