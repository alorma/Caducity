<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Categoria · Làctics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Figtree:wght@400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:#4D5A1E}a:hover{color:#283010}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'opsz' 24;display:inline-block}
.msf{font-variation-settings:'FILL' 1,'wght' 400,'opsz' 24}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF6EC; font-family: 'Figtree', sans-serif; color: #29241C">
  <div style="padding: 16px 20px 120px; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; justify-content: space-between; align-items: center; margin: 0 -8px">
      <a href="Rebost.dc.html" aria-label="Torna" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #29241C; text-decoration: none"><span class="ms" style="font-size: 24px">arrow_back</span></a>
      <button aria-label="Més opcions" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: transparent; color: #29241C; display: flex; align-items: center; justify-content: center; cursor: pointer"><span class="ms" style="font-size: 24px">more_vert</span></button>
    </div>

    <div style="display: flex; align-items: center; gap: 16px">
      <div style="position: relative; width: 80px; height: 80px; flex: none; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="{{cookie}}" fill="#E6DBC5"></path></svg>
        <span class="ms" style="position: relative; font-size: 36px; color: #4D5A1E">water_full</span>
      </div>
      <div>
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; font-weight: 800; font-stretch: 80%; line-height: 1.05">Làctics</h1>
        <div style="font-size: 14px; color: #665C4C; margin-top: 4px">14 productes · propera, avui</div>
      </div>
    </div>

    <div role="group" aria-label="Filtra per estat" style="display: flex; gap: 8px; overflow: hidden; margin-right: -20px">
      <button style="flex: none; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px 0 10px; border: none; border-radius: 12px; background: #4D5A1E; color: #FFFFFF; font-family: 'Figtree', sans-serif; font-size: 14px; font-weight: 700"><span class="ms" style="font-size: 18px">check</span>Tots 14</button>
      <button style="flex: none; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 1px solid #DCCFB8; border-radius: 12px; background: transparent; color: #29241C; font-family: 'Figtree', sans-serif; font-size: 14px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 4px; background: #B23F2A"></span>Caducat 1</button>
      <button style="flex: none; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 1px solid #DCCFB8; border-radius: 12px; background: transparent; color: #29241C; font-family: 'Figtree', sans-serif; font-size: 14px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 4px; background: #D9A23A"></span>Aviat 4</button>
      <button style="flex: none; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 1px solid #DCCFB8; border-radius: 12px; background: transparent; color: #29241C; font-family: 'Figtree', sans-serif; font-size: 14px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 4px; background: #7E9B4C"></span>Fresc 8</button>
      <button style="flex: none; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 1px solid #DCCFB8; border-radius: 12px; background: transparent; color: #29241C; font-family: 'Figtree', sans-serif; font-size: 14px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 4px; background: #4F8FA3"></span>Congelat 1</button>
    </div>

    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
          <span style="width: 10px; height: 10px; border-radius: 5px; background: {{sec.dot}}"></span>
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700; font-stretch: 85%">{{sec.title}}</h2>
          <span style="font-size: 13px; color: #665C4C">{{sec.count}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="2">
            <sc-if value="{{r.main}}" hint-placeholder-val="{{ true }}">
              <a href="Accions.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; box-sizing: border-box; padding: 10px 12px 10px 16px; background: #F4ECDD; border-radius: {{r.rad}}; color: #29241C; text-decoration: none">
                <div style="flex: 1; min-width: 0">
                  <div style="font-size: 16px; font-weight: 600">{{r.name}}</div>
                  <div style="font-size: 13px; color: #665C4C; margin-top: 2px">{{r.meta}}</div>
                </div>
                <span style="flex: none; padding: 6px 10px; border-radius: 12px; background: {{r.pillBg}}; color: {{r.pillFg}}; font-size: 13px; font-weight: 700">{{r.when}}</span>
                <sc-if value="{{r.group}}" hint-placeholder-val="{{ false }}">
                  <span class="ms" style="font-size: 22px; color: #665C4C">expand_less</span>
                </sc-if>
              </a>
            </sc-if>
            <sc-if value="{{r.unit}}" hint-placeholder-val="{{ false }}">
              <a href="Accions.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; box-sizing: border-box; padding: 8px 16px 8px 32px; background: #F4ECDD; border-radius: {{r.rad}}; color: #29241C; text-decoration: none">
                <span style="width: 6px; height: 6px; border-radius: 3px; background: #7E9B4C; flex: none"></span>
                <div style="flex: 1; font-size: 15px">{{r.name}}</div>
                <div style="font-size: 13px; color: #665C4C">{{r.when}}</div>
              </a>
            </sc-if>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <a href="Afegir.dc.html" style="position: absolute; right: 20px; bottom: 24px; display: flex; align-items: center; gap: 10px; height: 64px; padding: 0 24px 0 20px; border-radius: 20px; background: #4D5A1E; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 700; box-shadow: 0 6px 20px rgba(41,36,28,0.18)"><span class="ms" style="font-size: 26px">add</span>Afegeix</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  blob(n, a, rot) {
    rot = rot || 0;
    var p = [];
    for (var i = 0; i < 120; i++) {
      var t = i / 120 * Math.PI * 2;
      var r = 50 - a + a * Math.cos(n * (t + rot));
      p.push((50 + r * Math.cos(t)).toFixed(1) + " " + (50 + r * Math.sin(t)).toFixed(1));
    }
    return "M" + p.join("L") + "Z";
  }
  rad(i, n) {
    if (n === 1) return "24px";
    if (i === 0) return "24px 24px 6px 6px";
    if (i === n - 1) return "6px 6px 24px 24px";
    return "6px";
  }
  renderVals() {
    var self = this;
    var P = {
      exp: ["#F7D8CC", "#7A2414"], soon: ["#F8E2AE", "#5C3F00"], fresh: ["#DCE8C4", "#2F4515"], frz: ["#D3E5EA", "#163F4C"]
    };
    var raw = [
      { title: "Caducat", count: "1", dot: "#B23F2A", st: "exp", rows: [
        { name: "Iogurt grec", meta: "1 unitat · ds. 9 oct", when: "Fa 2 dies" }] },
      { title: "Aviat", count: "4", dot: "#D9A23A", st: "soon", rows: [
        { name: "Llet sencera", meta: "1 brick · dg. 11 oct", when: "Avui" },
        { name: "Mozzarella", meta: "1 unitat · dl. 12 oct", when: "Demà" },
        { name: "Iogurt natural", meta: "2 unitats · dt. 13 oct", when: "2 dies" }] },
      { title: "Fresc", count: "8", dot: "#7E9B4C", st: "fresh", rows: [
        { name: "Formatge cheddar", meta: "3 unitats · propera dc. 21 oct", when: "10 dies", group: true },
        { name: "Unitat 1", when: "dc. 21 oct", unit: true },
        { name: "Unitat 2", when: "dl. 26 oct", unit: true },
        { name: "Unitat 3", when: "ds. 31 oct", unit: true },
        { name: "Mantega", meta: "1 unitat · dl. 2 nov", when: "22 dies" },
        { name: "Kéfir", meta: "1 ampolla · dc. 4 nov", when: "24 dies" }] },
      { title: "Congelat", count: "1", dot: "#4F8FA3", st: "frz", rows: [
        { name: "Parmesà ratllat", meta: "Congelat el 28 set", when: "Congelat" }] }
    ];
    var sections = raw.map(function (s) {
      return {
        title: s.title, count: s.count, dot: s.dot,
        rows: s.rows.map(function (r, i) {
          return {
            name: r.name, meta: r.meta || "", when: r.when,
            main: !r.unit, unit: !!r.unit, group: !!r.group,
            pillBg: P[s.st][0], pillFg: P[s.st][1],
            rad: self.rad(i, s.rows.length)
          };
        })
      };
    });
    return { sections: sections, cookie: this.blob(9, 3, 0) };
  }
}
</script>
</body>
</html>
