<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Figtree:wght@400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:#4D5A1E}a:hover{color:#283010}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'opsz' 24;display:inline-block}
.msf{font-variation-settings:'FILL' 1,'wght' 400,'opsz' 24}

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF6EC; font-family: 'Figtree', sans-serif; color: #29241C">
  <div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; align-items: center; gap: 4px; margin-left: -8px">
      <a href="Rebost.dc.html" aria-label="Tanca" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #29241C; text-decoration: none"><span class="ms" style="font-size: 24px">close</span></a>
      <h1 style="flex: 1; margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 700; font-stretch: 85%">Nova categoria</h1>
      <a href="Rebost.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 22px; background: #4D5A1E; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 700">Desa</a>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0">
      <div style="position: relative; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="{{sel}}" fill="#E6DBC5"></path></svg>
        <span class="ms" style="position: relative; font-size: 42px; color: #4D5A1E">local_drink</span>
      </div>
      <div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 800; font-stretch: 80%">Begudes</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="cnom" style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #665C4C; padding: 0 4px">Nom</label>
      <input id="cnom" value="Begudes" style="width: 100%; box-sizing: border-box; height: 56px; border: 2px solid #4D5A1E; border-radius: 16px; background: #ECE2CF; padding: 0 18px; font-family: 'Figtree', sans-serif; font-size: 18px; font-weight: 600; color: #29241C">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #665C4C; padding: 0 4px">Forma</div>
      <div role="radiogroup" aria-label="Forma" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{shapes}}" as="s" hint-placeholder-count="6">
          <button role="radio" aria-checked="{{s.on}}" aria-label="{{s.name}}" style="height: 52px; border: {{s.border}}; border-radius: 16px; background: {{s.bg}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
            <svg viewBox="0 0 100 100" aria-hidden="true" style="width: 34px; height: 34px"><path d="{{s.d}}" fill="{{s.fill}}"></path></svg>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #665C4C; padding: 0 4px">Icona</div>
      <div role="radiogroup" aria-label="Icona" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{icons}}" as="i" hint-placeholder-count="12">
          <button role="radio" aria-checked="{{i.on}}" aria-label="{{i.name}}" style="height: 48px; border: none; border-radius: 24px; background: {{i.bg}}; color: {{i.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><span class="ms" style="font-size: 22px">{{i.name}}</span></button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #665C4C; padding: 0 4px">Avisa'm abans</div>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 20px; background: #F4ECDD">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px" aria-live="polite">
            <div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 800; font-stretch: 80%; line-height: 1">1 setmana</div>
            <div style="font-size: 13px; color: #665C4C">7 dies abans de caducar</div>
          </div>
          <div role="slider" aria-label="Marge d'avís" aria-valuetext="1 setmana" aria-valuemin="1" aria-valuemax="90" style="position: relative; height: 44px; margin: 4px 14px 0">
            <span style="position: absolute; left: -8px; width: calc(42.8571% - 6px + 8px); top: 14px; height: 16px; border-radius: 8px 2px 2px 8px; background: #4D5A1E"></span>
            <span style="position: absolute; left: calc(42.8571% + 6px); right: -8px; top: 14px; height: 16px; border-radius: 2px 8px 8px 2px; background: #DCE3B0"></span>
            <span style="position: absolute; left: 0; right: 0; top: 0; height: 44px"><span style="position: absolute; left: 0.0000%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 2px; background: #DCE3B0"></span><span style="position: absolute; left: 14.2857%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 2px; background: #DCE3B0"></span><span style="position: absolute; left: 28.5714%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 2px; background: #DCE3B0"></span><span style="position: absolute; left: 57.1429%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 2px; background: #4D5A1E"></span><span style="position: absolute; left: 71.4286%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 2px; background: #4D5A1E"></span><span style="position: absolute; left: 85.7143%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 2px; background: #4D5A1E"></span><span style="position: absolute; left: 100.0000%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 2px; background: #4D5A1E"></span></span>
            <span style="position: absolute; left: 42.8571%; top: 0; width: 4px; height: 44px; margin-left: -2px; border-radius: 2px; background: #4D5A1E"></span>
          </div>
          <div style="position: relative; height: 18px; margin: 0 14px"><span style="position: absolute; left: 0.0000%; transform: translateX(-50%); font-size: 13px; font-weight: 600; color: #665C4C">1</span><span style="position: absolute; left: 14.2857%; transform: translateX(-50%); font-size: 13px; font-weight: 600; color: #665C4C">2</span><span style="position: absolute; left: 28.5714%; transform: translateX(-50%); font-size: 13px; font-weight: 600; color: #665C4C">3</span><span style="position: absolute; left: 42.8571%; transform: translateX(-50%); font-size: 13px; font-weight: 800; color: #29241C">1</span><span style="position: absolute; left: 57.1429%; transform: translateX(-50%); font-size: 13px; font-weight: 600; color: #665C4C">2</span><span style="position: absolute; left: 71.4286%; transform: translateX(-50%); font-size: 13px; font-weight: 600; color: #665C4C">1</span><span style="position: absolute; left: 85.7143%; transform: translateX(-50%); font-size: 13px; font-weight: 600; color: #665C4C">2</span><span style="position: absolute; left: 100.0000%; transform: translateX(-50%); font-size: 13px; font-weight: 600; color: #665C4C">3</span></div>
          <div style="position: relative; height: 26px; margin: 0 14px"><span style="position: absolute; left: 0.0000%; width: 28.5714%; top: 0; display: flex; flex-direction: column; align-items: stretch; gap: 3px"><span style="height: 6px; border: 1.5px solid #CDBFA6; border-top: none; border-radius: 0 0 6px 6px; margin: 0 -6px"></span><span style="text-align: center; font-size: 12px; font-weight: 600; color: #665C4C; white-space: nowrap">dies</span></span><span style="position: absolute; left: 42.8571%; width: 14.2857%; top: 0; display: flex; flex-direction: column; align-items: stretch; gap: 3px"><span style="height: 6px; border: 1.5px solid #CDBFA6; border-top: none; border-radius: 0 0 6px 6px; margin: 0 -6px"></span><span style="text-align: center; font-size: 12px; font-weight: 600; color: #665C4C; white-space: nowrap">setmanes</span></span><span style="position: absolute; left: 71.4286%; width: 28.5714%; top: 0; display: flex; flex-direction: column; align-items: stretch; gap: 3px"><span style="height: 6px; border: 1.5px solid #CDBFA6; border-top: none; border-radius: 0 0 6px 6px; margin: 0 -6px"></span><span style="text-align: center; font-size: 12px; font-weight: 600; color: #665C4C; white-space: nowrap">mesos</span></span></div>
        </div>
        <div style="font-size: 13px; color: #665C4C; padding: 0 4px">Llisca o toca un punt. Les begudes passaran a «Aviat» una setmana abans.</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="cdesc" style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #665C4C; padding: 0 4px">Descripció · opcional</label>
      <textarea id="cdesc" placeholder="Per exemple: refrescos, sucs i begudes fermentades" style="width: 100%; box-sizing: border-box; height: 80px; border: none; border-radius: 16px; background: #ECE2CF; padding: 14px 18px; font-family: 'Figtree', sans-serif; font-size: 15px; color: #29241C; resize: none"></textarea>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  blob(n, a, rot) {
    rot = rot || 0;
    var p = [];
    for (var i = 0; i < 120; i++) {
      var t = i / 120 * Math.PI * 2;
      var r = 50 - a + a * Math.cos(n * (t + rot));
      p.push((50 + r * Math.cos(t)).toFixed(1) + " " + (50 + r * Math.sin(t)).toFixed(1));
    }
    return "M" + p.join("L") + "Z";
  }
  renderVals() {
    var self = this;
    var sh = [
      ["Galeta", 9, 3, 0], ["Flor", 6, 6, 0], ["Trèvol", 4, 8, Math.PI / 4],
      ["Sol", 8, 4, 0], ["Coixí", 4, 2.5, Math.PI / 4], ["Segell", 12, 3, 0]
    ];
    var shapes = sh.map(function (s, k) {
      var on = k === 5;
      return {
        name: s[0], d: self.blob(s[1], s[2], s[3]), on: on ? "true" : "false",
        bg: on ? "#DCE3B0" : "#F4ECDD", border: on ? "2px solid #4D5A1E" : "none",
        fill: on ? "#4D5A1E" : "#CDBFA6"
      };
    });
    var names = ["local_drink", "local_cafe", "liquor", "icecream", "egg", "rice_bowl", "cookie", "soup_kitchen", "kebab_dining", "lunch_dining", "breakfast_dining", "eco"];
    var icons = names.map(function (n, k) {
      var on = k === 0;
      return { name: n, on: on ? "true" : "false", bg: on ? "#4D5A1E" : "#F4ECDD", fg: on ? "#FFFFFF" : "#4D5A1E" };
    });
    return { shapes: shapes, icons: icons, sel: this.blob(12, 3, 0) };
  }
}
</script>
</body>
</html>
