<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Calendari · mes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Figtree:wght@400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:#4D5A1E}a:hover{color:#283010}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'opsz' 24;display:inline-block}
.msf{font-variation-settings:'FILL' 1,'wght' 400,'opsz' 24}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF6EC; font-family: 'Figtree', sans-serif; color: #29241C">
  <div style="padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 14px">

    <div style="display: flex; align-items: center; gap: 4px; margin: 0 -8px">
      <a href="Main.dc.html" aria-label="Torna" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #29241C; text-decoration: none"><span class="ms" style="font-size: 24px">arrow_back</span></a>
      <h1 style="flex: 1; margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800; font-stretch: 80%">Octubre 2026</h1>
      <button aria-label="Mes anterior" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: transparent; color: #29241C; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 24px">chevron_left</span></button>
      <button aria-label="Mes següent" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: transparent; color: #29241C; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 24px">chevron_right</span></button>
    </div>

    <div style="padding: 10px 8px 8px; border-radius: 24px; background: #F4ECDD">
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding-bottom: 6px">
        <sc-for list="{{wds}}" as="w" hint-placeholder-count="7">
          <span style="text-align: center; font-size: 12px; font-weight: 700; color: #665C4C">{{w}}</span>
        </sc-for>
      </div>
      <div role="grid" aria-label="Octubre 2026" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
          <button aria-label="{{c.label}}" aria-pressed="{{c.selA}}" style="display: flex; flex-direction: column; align-items: center; gap: 3px; height: 52px; padding: 3px 0 0; border: none; border-radius: 14px; background: transparent; color: {{c.fg}}; font-family: 'Figtree', sans-serif; visibility: {{c.vis}}; cursor: pointer">
            <span style="width: 34px; height: 34px; box-sizing: border-box; border-radius: 17px; border: {{c.ring}}; background: {{c.bg}}; color: {{c.numFg}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: {{c.fw}}">{{c.n}}</span>
            <span style="display: flex; gap: 2px; height: 5px">
              <sc-for list="{{c.dots}}" as="d" hint-placeholder-count="1">
                <span style="width: 5px; height: 5px; border-radius: 3px; background: {{d}}"></span>
              </sc-for>
            </span>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: center; gap: 16px; padding-top: 8px; font-size: 12px; color: #665C4C">
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #B23F2A"></span>Caducat</span>
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #D9A23A"></span>Aviat</span>
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #7E9B4C"></span>Fresc</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; gap: 8px; padding: 0 4px">
        <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700; font-stretch: 85%">Avui</h2>
        <span style="font-size: 13px; color: #665C4C">diumenge 11 · 2 productes</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <a href="Accions.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 64px; box-sizing: border-box; padding: 10px 12px; border-radius: 24px 24px 6px 6px; background: #F4ECDD; color: #29241C; text-decoration: none">
          <div style="position: relative; width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center">
            <svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="{{cookie}}" fill="#E6DBC5"></path></svg>
            <span class="ms" style="position: relative; font-size: 22px; color: #4D5A1E">water_full</span>
          </div>
          <div style="flex: 1"><div style="font-size: 16px; font-weight: 600">Llet sencera</div><div style="font-size: 13px; color: #665C4C; margin-top: 2px">Làctics · 1 brick</div></div>
          <span style="padding: 6px 10px; border-radius: 12px; background: #F8E2AE; color: #5C3F00; font-size: 13px; font-weight: 700">Avui</span>
        </a>
        <a href="Accions.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 64px; box-sizing: border-box; padding: 10px 12px; border-radius: 6px 6px 24px 24px; background: #F4ECDD; color: #29241C; text-decoration: none">
          <div style="position: relative; width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center">
            <svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="{{flower}}" fill="#E6DBC5"></path></svg>
            <span class="ms" style="position: relative; font-size: 22px; color: #4D5A1E">nutrition</span>
          </div>
          <div style="flex: 1"><div style="font-size: 16px; font-weight: 600">Espinacs</div><div style="font-size: 13px; color: #665C4C; margin-top: 2px">Fruita i verdura · 1 bossa</div></div>
          <span style="padding: 6px 10px; border-radius: 12px; background: #F8E2AE; color: #5C3F00; font-size: 13px; font-weight: 700">Avui</span>
        </a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  blob(n, a, rot) {
    rot = rot || 0;
    var p = [];
    for (var i = 0; i < 120; i++) {
      var t = i / 120 * Math.PI * 2;
      var r = 50 - a + a * Math.cos(n * (t + rot));
      p.push((50 + r * Math.cos(t)).toFixed(1) + " " + (50 + r * Math.sin(t)).toFixed(1));
    }
    return "M" + p.join("L") + "Z";
  }
  renderVals() {
    var E = "#B23F2A", A = "#D9A23A", F = "#7E9B4C";
    var dots = {
      6: [E], 8: [E], 9: [E, E], 10: [E, E, E],
      11: [A, A], 12: [A, A, A], 13: [A, A], 14: [A, A],
      15: [F], 17: [F], 18: [F], 21: [F, F], 25: [F], 26: [F], 31: [F]
    };
    var cells = [];
    for (var b = 0; b < 3; b++) cells.push({ n: "", dots: [], vis: "hidden", bg: "transparent", numFg: "inherit", fg: "#29241C", ring: "none", fw: 400, label: "", selA: "false" });
    for (var d = 1; d <= 31; d++) {
      var sel = d === 11, today = d === 11, past = d < 11;
      var ds = dots[d] || [];
      cells.push({
        n: String(d), dots: ds, vis: "visible",
        bg: sel ? "#4D5A1E" : "transparent",
        numFg: sel ? "#FFFFFF" : "inherit",
        fg: past && ds.length === 0 ? "#8A7F6C" : "#29241C",
        ring: sel ? "2px solid transparent" : (today ? "2px solid #29241C" : "2px solid transparent"),
        fw: (sel || today || ds.length) ? 700 : 400,
        label: d + " d'octubre" + (ds.length ? ", " + ds.length + " productes" : ""),
        selA: sel ? "true" : "false"
      });
    }
    return { wds: ["dl", "dt", "dc", "dj", "dv", "ds", "dg"], cells: cells, cookie: this.blob(9, 3, 0), flower: this.blob(6, 6, 0) };
  }
}
</script>
</body>
</html>
