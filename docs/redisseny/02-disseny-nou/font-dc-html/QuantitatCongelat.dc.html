<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Modal · diverses unitats congelades</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Figtree:wght@400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E6B3B}a:hover{color:#10300F}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'opsz' 24;display:inline-block}
.msf{font-variation-settings:'FILL' 1,'wght' 400,'opsz' 24}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFAEE; font-family: 'Figtree', sans-serif; color: #2B2418">
  <div aria-hidden="true" style="padding: 76px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; font-weight: 800; font-stretch: 80%; padding-left: 96px">Plats preparats</div>
    <div style="height: 64px; border-radius: 24px 24px 6px 6px; background: #F7EEDA"></div>
    <div style="height: 64px; border-radius: 6px; background: #F7EEDA"></div>
    <div style="height: 64px; border-radius: 6px 6px 24px 24px; background: #F7EEDA"></div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(41,36,28,0.45)"></div>
  <div role="dialog" aria-labelledby="q-nom" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 28px; border-radius: 32px 32px 0 0; background: #FFFAEE; display: flex; flex-direction: column; gap: 20px">
    <div style="align-self: center; width: 32px; height: 4px; border-radius: 2px; background: #8F8266"></div>
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="position: relative; width: 48px; height: 48px; flex: none; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="{{puffy}}" fill="#EFD8C0"></path></svg>
        <span class="ms" style="position: relative; font-size: 24px; color: #2E6B3B">soup_kitchen</span>
      </div>
      <div style="flex: 1; min-width: 0">
        <h2 id="q-nom" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 700; font-stretch: 85%">Croquetes</h2>
        <div style="font-size: 14px; color: #6A5D45; margin-top: 2px">8 unitats · congelades el 4 oct</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; gap: 3px">
        <button aria-label="Una menys" style="width: 72px; height: 72px; flex: none; border: none; border-radius: 36px 8px 8px 36px; background: #DCE9C6; color: #10300F; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 28px">remove</span></button>
        <div aria-live="polite" style="flex: 1; height: 72px; border-radius: 8px; background: #F7EEDA; display: flex; align-items: baseline; justify-content: center; gap: 6px; padding-top: 12px; box-sizing: border-box"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 44px; font-weight: 800; font-stretch: 80%; line-height: 1">2</span><span style="font-size: 16px; font-weight: 600; color: #6A5D45">de 8</span></div>
        <button aria-label="Una més" style="width: 72px; height: 72px; flex: none; border: none; border-radius: 8px 36px 36px 8px; background: #DCE9C6; color: #10300F; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 28px">add</span></button>
      </div>
      <div style="font-size: 13px; color: #6A5D45; text-align: center">Primer les congelades fa més temps</div>
    </div>
    <div style="display: flex; gap: 3px">
      <button style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border: none; border-radius: 28px 8px 8px 28px; background: #2E6B3B; color: #FFFFFF; font-family: 'Figtree', sans-serif; font-size: 17px; font-weight: 700"><span class="ms" style="font-size: 24px">check</span>Consumeix 2</button>
      <button style="flex: 1.25; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border: none; border-radius: 8px 28px 28px 8px; background: #D3E5EA; color: #163F4C; font-family: 'Figtree', sans-serif; font-size: 17px; font-weight: 700"><span class="ms" style="font-size: 24px">sunny</span>Descongela 2</button>
    </div>
    <button aria-expanded="false" style="display: flex; align-items: center; gap: 16px; height: 56px; padding: 0 18px; border: none; border-radius: 24px; background: #F7EEDA; color: #2B2418; font-family: 'Figtree', sans-serif; font-size: 16px; font-weight: 600; text-align: left"><span class="ms" style="font-size: 22px; color: #6A5D45">more_horiz</span><span style="flex: 1">Més accions</span><span class="ms" style="font-size: 22px; color: #6A5D45">expand_more</span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  blob(n, a, rot) {
    rot = rot || 0;
    var p = [];
    for (var i = 0; i < 120; i++) {
      var t = i / 120 * Math.PI * 2;
      var r = 50 - a + a * Math.cos(n * (t + rot));
      p.push((50 + r * Math.cos(t)).toFixed(1) + " " + (50 + r * Math.sin(t)).toFixed(1));
    }
    return "M" + p.join("L") + "Z";
  }
  rad(i, n) {
    if (n === 1) return "24px";
    if (i === 0) return "24px 24px 6px 6px";
    if (i === n - 1) return "6px 6px 24px 24px";
    return "6px";
  }
  renderVals() {
    var self = this;
    var P = {
      exp: ["#F7D8CC", "#7A2414"], soon: ["#F8E2AE", "#5C3F00"], fresh: ["#DCE8C4", "#2F4515"], frz: ["#D3E5EA", "#163F4C"]
    };
    var raw = [
      { title: "Caducat", count: "1", dot: "#B23F2A", st: "exp", rows: [
        { name: "Iogurt grec", meta: "3 unitats · Fa 2 dies", when: "Fa 2 dies" }] },
      { title: "Aviat", count: "3", dot: "#D9A23A", st: "soon", rows: [
        { name: "Llet sencera", meta: "1 unitat · Avui", when: "Avui" },
        { name: "Mozzarella", meta: "1 unitat · Demà", when: "Demà" },
        { name: "Croquetes", meta: "4 unitats · D'aquí 2 dies", when: "2 dies" }] },
      { title: "Fresc", count: "8", dot: "#7E9B4C", st: "fresh", rows: [
        { name: "Formatge cheddar", meta: "3 unitats · D'aquí 10 dies", when: "10 dies" },
        { name: "Mantega", meta: "1 unitat · D'aquí 22 dies", when: "22 dies" },
        { name: "Ous", meta: "12 unitats · D'aquí 18 dies", when: "18 dies" }] },
      { title: "Congelat", count: "1", dot: "#4F8FA3", st: "frz", rows: [
        { name: "Parmesà ratllat", meta: "1 unitat · Congelat el 28 set", when: "Congelat" }] }
    ];
    var sections = raw.map(function (s) {
      return {
        title: s.title, count: s.count, dot: s.dot,
        rows: s.rows.map(function (r, i) {
          return {
            name: r.name, meta: r.meta || "", when: r.when,
            main: !r.unit, unit: !!r.unit, group: !!r.group,
            pillBg: P[s.st][0], pillFg: P[s.st][1],
            cons: s.st === "soon" || s.st === "fresh", exp: s.st === "exp", frz: s.st === "frz",
            metaFg: P[s.st][1], metaW: 600,
            rad: self.rad(i, s.rows.length)
          };
        })
      };
    });
    var A = "#D9A23A";
    var week = [
      ["dg", 11, [A], "Avui, 1 producte"], ["dl", 12, [A], "Demà, 1 producte"],
      ["dt", 13, [A], "Dimarts 13, 1 producte"], ["dc", 14, [], "Dimecres 14, res"],
      ["dj", 15, [], "Dijous 15, res"], ["dv", 16, [], "Divendres 16, res"], ["ds", 17, [], "Dissabte 17, res"]
    ];
    var days = week.map(function (d, i) {
      return {
        wd: d[0], n: d[1], dots: d[2], label: d[3],
        bg: i === 0 ? "#F7EEDA" : "transparent",
        ring: i === 0 ? "2px solid #2B2418" : "2px solid transparent"
      };
    });
    return { sections: sections, puffy: this.blob(10, 2.5, 0), days: days };
  }
}
</script>
</body>
</html>
