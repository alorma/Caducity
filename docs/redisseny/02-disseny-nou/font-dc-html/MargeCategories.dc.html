<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Marge per categoria</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Figtree:wght@400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:#4D5A1E}a:hover{color:#283010}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'opsz' 24;display:inline-block}
.msf{font-variation-settings:'FILL' 1,'wght' 400,'opsz' 24}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF6EC; font-family: 'Figtree', sans-serif; color: #29241C">
  <div style="padding: 16px 20px 40px; display: flex; flex-direction: column; gap: 14px">
    <a href="MargeAjustos.dc.html" aria-label="Torna" style="width: 48px; height: 48px; margin-left: -8px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #29241C; text-decoration: none"><span class="ms" style="font-size: 24px">arrow_back</span></a>
    <div>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; font-weight: 800; font-stretch: 80%; line-height: 1">Marge per categoria</h1>
      <p style="margin: 8px 0 0; font-size: 15px; line-height: 1.4; color: #665C4C">Quants dies abans de caducar un producte passa a «Aviat» i t'avisem.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; gap: 14px; padding: 10px 12px 10px 12px; background: {{r.bg}}; border-radius: {{r.rad}}">
          <div style="display: flex; align-items: center; gap: 14px; min-height: 48px">
            <div style="position: relative; width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center">
              <svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="{{r.shape}}" fill="{{r.shapeFill}}"></path></svg>
              <span class="ms" style="position: relative; font-size: 20px; color: #4D5A1E">{{r.icon}}</span>
            </div>
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 16px; font-weight: 600">{{r.name}}</div>
              <div style="font-size: 13px; color: #665C4C; margin-top: 2px">{{r.sub}}</div>
            </div>
            <span style="flex: none; padding: 6px 12px; border-radius: 12px; background: {{r.pillBg}}; color: {{r.pillFg}}; font-size: 13px; font-weight: 700">{{r.val}}</span>
          </div>
          <sc-if value="{{r.open}}">
            <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 0 6px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px" aria-live="polite">
            <div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 800; font-stretch: 80%; line-height: 1">1 mes</div>
            <div style="font-size: 13px; color: #665C4C">30 dies abans de caducar</div>
          </div>
          <div role="slider" aria-label="Marge d'avís" aria-valuetext="1 mes" aria-valuemin="1" aria-valuemax="90" style="position: relative; height: 44px; margin: 4px 14px 0">
            <span style="position: absolute; left: -8px; width: calc(71.4286% - 6px + 8px); top: 14px; height: 16px; border-radius: 8px 2px 2px 8px; background: #4D5A1E"></span>
            <span style="position: absolute; left: calc(71.4286% + 6px); right: -8px; top: 14px; height: 16px; border-radius: 2px 8px 8px 2px; background: #DCE3B0"></span>
            <span style="position: absolute; left: 0; right: 0; top: 0; height: 44px"><span style="position: absolute; left: 0.0000%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 2px; background: #DCE3B0"></span><span style="position: absolute; left: 14.2857%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 2px; background: #DCE3B0"></span><span style="position: absolute; left: 28.5714%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 2px; background: #DCE3B0"></span><span style="position: absolute; left: 42.8571%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 2px; background: #DCE3B0"></span><span style="position: absolute; left: 57.1429%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 2px; background: #DCE3B0"></span><span style="position: absolute; left: 85.7143%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 2px; background: #4D5A1E"></span><span style="position: absolute; left: 100.0000%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 2px; background: #4D5A1E"></span></span>
            <span style="position: absolute; left: 71.4286%; top: 0; width: 4px; height: 44px; margin-left: -2px; border-radius: 2px; background: #4D5A1E"></span>
          </div>
          <div style="position: relative; height: 18px; margin: 0 14px"><span style="position: absolute; left: 0.0000%; transform: translateX(-50%); font-size: 13px; font-weight: 600; color: #665C4C">1</span><span style="position: absolute; left: 14.2857%; transform: translateX(-50%); font-size: 13px; font-weight: 600; color: #665C4C">2</span><span style="position: absolute; left: 28.5714%; transform: translateX(-50%); font-size: 13px; font-weight: 600; color: #665C4C">3</span><span style="position: absolute; left: 42.8571%; transform: translateX(-50%); font-size: 13px; font-weight: 600; color: #665C4C">1</span><span style="position: absolute; left: 57.1429%; transform: translateX(-50%); font-size: 13px; font-weight: 600; color: #665C4C">2</span><span style="position: absolute; left: 71.4286%; transform: translateX(-50%); font-size: 13px; font-weight: 800; color: #29241C">1</span><span style="position: absolute; left: 85.7143%; transform: translateX(-50%); font-size: 13px; font-weight: 600; color: #665C4C">2</span><span style="position: absolute; left: 100.0000%; transform: translateX(-50%); font-size: 13px; font-weight: 600; color: #665C4C">3</span></div>
          <div style="position: relative; height: 26px; margin: 0 14px"><span style="position: absolute; left: 0.0000%; width: 28.5714%; top: 0; display: flex; flex-direction: column; align-items: stretch; gap: 3px"><span style="height: 6px; border: 1.5px solid #CDBFA6; border-top: none; border-radius: 0 0 6px 6px; margin: 0 -6px"></span><span style="text-align: center; font-size: 12px; font-weight: 600; color: #665C4C; white-space: nowrap">dies</span></span><span style="position: absolute; left: 42.8571%; width: 14.2857%; top: 0; display: flex; flex-direction: column; align-items: stretch; gap: 3px"><span style="height: 6px; border: 1.5px solid #CDBFA6; border-top: none; border-radius: 0 0 6px 6px; margin: 0 -6px"></span><span style="text-align: center; font-size: 12px; font-weight: 600; color: #665C4C; white-space: nowrap">setmanes</span></span><span style="position: absolute; left: 71.4286%; width: 28.5714%; top: 0; display: flex; flex-direction: column; align-items: stretch; gap: 3px"><span style="height: 6px; border: 1.5px solid #CDBFA6; border-top: none; border-radius: 0 0 6px 6px; margin: 0 -6px"></span><span style="text-align: center; font-size: 12px; font-weight: 600; color: #665C4C; white-space: nowrap">mesos</span></span></div>
        </div>
              <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #665C4C; padding: 0 4px"><span class="ms" style="font-size: 18px; color: #4D5A1E">lightbulb</span>Suggerit per a secs i pasta: 1 mes</div>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
    <button style="align-self: flex-start; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 12px; border: none; border-radius: 22px; background: transparent; color: #4D5A1E; font-family: 'Figtree', sans-serif; font-size: 15px; font-weight: 700"><span class="ms" style="font-size: 20px">restart_alt</span>Torna als valors suggerits</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  blob(n, a, rot) {
    rot = rot || 0;
    var p = [];
    for (var i = 0; i < 120; i++) {
      var t = i / 120 * Math.PI * 2;
      var r = 50 - a + a * Math.cos(n * (t + rot));
      p.push((50 + r * Math.cos(t)).toFixed(1) + " " + (50 + r * Math.sin(t)).toFixed(1));
    }
    return "M" + p.join("L") + "Z";
  }
  rad(i, n) {
    if (n === 1) return "24px";
    if (i === 0) return "24px 24px 6px 6px";
    if (i === n - 1) return "6px 6px 24px 24px";
    return "6px";
  }
  renderVals() {
    var self = this;
    var raw = [
      ["Carn i peix", "set_meal", this.blob(4, 8, Math.PI / 4), "2 dies", 0],
      ["Fleca", "bakery_dining", this.blob(4, 2.5, Math.PI / 4), "2 dies", 0],
      ["Làctics", "water_full", this.blob(9, 3, 0), "3 dies", 0],
      ["Fruita i verdura", "nutrition", this.blob(6, 6, 0), "3 dies", 0],
      ["Rebost", "grocery", this.blob(8, 4, 0), "1 mes", 1],
      ["Begudes", "local_drink", this.blob(12, 3, 0), "1 setmana", 0],
      ["Salses", "soup_kitchen", this.blob(6, 6, 0), "3 dies", 2]
    ];
    var rows = raw.map(function (r, i) {
      var open = r[4] === 1, def = r[4] === 2;
      return {
        name: r[0], icon: r[1], shape: r[2], val: r[3], open: open,
        sub: def ? "Per defecte (Ajustos)" : "Avisa " + r[3] + " abans",
        bg: open ? "#ECE2CF" : "#F4ECDD", shapeFill: open ? "#DCE3B0" : "#E6DBC5",
        pillBg: open ? "#4D5A1E" : (def ? "transparent" : "#FBF6EC"),
        pillFg: open ? "#FFFFFF" : (def ? "#665C4C" : "#29241C"),
        rad: self.rad(i, raw.length)
      };
    });
    return { rows: rows };
  }
}
</script>
</body>
</html>
