name: PR Build

# Runs the unit tests and checks that the debug APK builds, without uploading it
on:
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() }}
        # Les PR de forks no tenen permís per crear el resultat; no ha de fer fallar el job
        continue-on-error: true
        with:
          check_name: Unit test results
          report_paths: "**/build/test-results/**/*.xml"
          detailed_summary: true

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: "*/build/reports/tests/testDebugUnitTest"
          retention-days: 3

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      # Sense keystore es construeix sense signar; serveix per comprovar que R8 i els recursos no trenquen el release
      - name: Build release APK
        run: ./gradlew :app:assembleRelease
