name: Bootstrap Play listing

# One-off: downloads the current Google Play listing (texts, graphics, release notes) with Gradle Play Publisher
# and uploads app/src/main/play as an artifact. Manual trigger only
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-publish
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      - name: Bootstrap listing
        run: ./gradlew :app:bootstrapReleaseListing
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.SERVICE_ACCOUNT_JSON }}

      - name: Upload play directory
        uses: actions/upload-artifact@v7
        with:
          name: play-listing
          path: app/src/main/play
          if-no-files-found: error
          retention-days: 7
