name: Update Screenshots

on:
  workflow_dispatch:  # Allow manual trigger from GitHub UI
  push:
    branches:
      - main
    paths:
      - 'app/src/screenshotTest/**'
      - 'app/src/main/**/preview/**'
      - 'app/src/main/**/theme/**'

permissions:
  contents: write  # Required to push changes back to the repository

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-screenshots:
    name: Generate and Update Screenshots
    runs-on: ubuntu-latest
    # Only run on main branch to prevent accidental pushes from other branches
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Full history for proper git operations

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: adopt
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Generate Screenshots
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Check for screenshot changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain app/src/screenshotTestDebug/reference/) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Screenshot changes detected"
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No screenshot changes detected"
          fi

      - name: Configure Git
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push Screenshots
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git add app/src/screenshotTestDebug/reference/
          git commit -m "Update screenshot test reference images [skip ci]"
          git push origin HEAD:main

      - name: Upload Screenshots as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-references
          path: app/src/screenshotTestDebug/reference/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          if [[ "${{ steps.check_changes.outputs.changes }}" == "true" ]]; then
            echo "✅ Screenshot reference images have been updated and pushed to main" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No screenshot changes detected - reference images are up to date" >> $GITHUB_STEP_SUMMARY
          fi
